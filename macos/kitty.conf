
# ==============================================================================
# macOS overrides (appended to kitty.conf by install.sh on macOS; later
# settings win, so these replace the Linux values above)
# ==============================================================================

# Retina screens render points smaller than Linux; Menlo is always present
font_family      Menlo
font_size        13.0

# Make Option behave as Alt, so the alt+arrow split navigation above and
# readline's Alt bindings (Alt+. etc.) work. Without this Option types
# special characters (å, ∑, ...).
macos_option_as_alt yes

# Abstract sockets (unix:@...) are Linux-only; use a real path
listen_on unix:/tmp/kitty-{kitty_pid}

# Closing the last window quits kitty, like on Linux (default keeps it in the Dock)
macos_quit_when_last_window_closed yes
